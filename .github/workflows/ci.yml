name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A short weekly fuzz run catches unexpected parsing edge cases without
    # consuming private-repository minutes on every pull request.
    - cron: "37 4 * * 1"

# Least privilege: nothing here needs write access to the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref. This repository is
# private, so Actions minutes come out of a quota; cancelling stale runs keeps
# that from being spent on results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the baseline. Windows earns its place because
        # internal/ctfd/download.go carries real platform-specific logic --
        # reserved device names, invalid filename characters, path separators --
        # and that is exactly the code that decides where downloaded files land.
        #
        # macOS is deliberately absent: the code has no Darwin-specific paths,
        # and macOS runners bill at 10x the Linux rate on a private repo. The
        # cross-compile job below still proves it builds for Darwin.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Track the toolchain declared in go.mod rather than pinning a second
          # version here that can silently drift out of step with it.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # Includes the end-to-end test, which compiles the real binary and
        # drives it over stdio the way an MCP client does.
        run: go test -count=1 ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        # The race detector needs cgo and a C toolchain, which the development
        # machine for this project does not have -- so this job is the only
        # place the concurrency in the client (cached CSRF nonce, login
        # serialization, the TTL cache, the attempt log) is actually checked
        # for data races.
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./internal/...

  lint:
    name: Format and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # gofmt -l lists files needing formatting and exits 0 either way, so the
        # output has to be inspected to turn it into a failure.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "All files are gofmt-formatted."

      - name: go mod tidy is up to date
        # A stale go.mod or go.sum breaks `go install` for anyone fetching the
        # module, which would not show up in a plain build.
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod or go.sum is out of date. Run: go mod tidy"
            git diff -- go.mod go.sum
            exit 1
          fi
          echo "go.mod and go.sum are tidy."

      - name: staticcheck
        # Run the tool directly rather than through dominikh/staticcheck-action,
        # which bundles its own SHA-pinned actions/cache and drags a Node 20
        # deprecation warning into every run. One fewer third-party action in
        # the supply chain, and the version is pinned here where it is visible.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  security:
    name: Reachable dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Report only vulnerabilities reachable from this program, rather than
        # every advisory affecting any transitive module in the graph.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  ctfd-compat:
    name: Live CTFd compatibility (${{ matrix.ctfd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the oldest supported version plus the latest patch release from
        # each later 3.x line. Pinning avoids a passing build silently changing
        # its coverage when CTFd releases a new image.
        ctfd: ["3.6.1", "3.7.7", "3.8.6"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start CTFd
        run: >-
          docker run --detach --name ctfd --publish 8000:8000
          --env SECRET_KEY=ctfd-mcp-ci-secret-not-for-production
          ctfd/ctfd:${{ matrix.ctfd }}

      - name: Create a player and a test challenge
        id: bootstrap
        env:
          CTFD_SMOKE_URL: http://127.0.0.1:8000
          CTFD_SMOKE_USERNAME: ctfd-mcp-player
          CTFD_SMOKE_PASSWORD: ctfd-mcp-password
        run: python3 scripts/ci/bootstrap_ctfd.py

      - name: Exercise the real server over MCP stdio
        env:
          CTFD_INTEGRATION_URL: http://127.0.0.1:8000
          CTFD_INTEGRATION_USERNAME: ctfd-mcp-player
          CTFD_INTEGRATION_PASSWORD: ctfd-mcp-password
          CTFD_INTEGRATION_CHALLENGE_ID: ${{ steps.bootstrap.outputs.challenge_id }}
          CTFD_INTEGRATION_FLAG: flag{ctfd_mcp_live_smoke}
        run: >-
          go test -count=1 -tags=ctfdintegration ./cmd/ctfd-mcp
          -run '^TestRealCTFdPasswordLoginSmoke$'

      - name: Show CTFd logs after a failure
        if: failure()
        run: docker logs ctfd

  fuzz:
    name: Scheduled fuzzing
    # Fuzzing has diminishing returns for every push, but is useful as a
    # periodic guardrail for the hostile filename parsing used by downloads.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz download filename handling
        run: go test ./internal/ctfd -run '^$' -fuzz '^FuzzSafeFilename$' -fuzztime=1m

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every release target
        # The point of shipping a static Go binary is that these all work, so a
        # break here is a real regression even though nothing runs the output.
        run: |
          set -euo pipefail
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "--> $os/$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/ctfd-mcp
          done
          echo "All targets build."
